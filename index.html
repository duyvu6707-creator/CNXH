<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn thi CNXHKH – Chương 4</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
:root{--bg:#fff;--ink:#3c3c3c;--mut:#777;--line:#e5e5e5;--card:#f7f7f7;--g:#58cc02;--gd:#58a700;--gl:#d7ffb8;--r:#ff4b4b;--rd:#ea2b2b;--rl:#ffdfe0;--b:#1cb0f6;--y:#ffc800;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131f24;--ink:#e8eef0;--mut:#8a9aa0;--line:#37464f;--card:#202f36;--gl:#1f3a14;--rl:#3d1d1f}}
:root[data-theme="dark"]{--bg:#131f24;--ink:#e8eef0;--mut:#8a9aa0;--line:#37464f;--card:#202f36;--gl:#1f3a14;--rl:#3d1d1f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Nunito,"Segoe UI",system-ui,sans-serif;font-weight:700}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.stats{display:flex;justify-content:space-around;padding:12px;border-bottom:2px solid var(--line);font-weight:900;position:sticky;top:0;background:var(--bg);z-index:5}
.hero{padding:20px 20px 4px}.hero h1{margin:0;font-size:24px;font-weight:900}.hero p{margin:4px 0 0;color:var(--mut)}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 16px 40px}
.unit{width:100%;max-width:340px;text-align:center}
.node{width:84px;height:84px;border-radius:50%;font-size:34px;background:var(--g);box-shadow:0 7px 0 var(--gd);transition:transform .1s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--gd)}
.node.lock{background:var(--line);box-shadow:0 7px 0 #c4c4c4;cursor:not-allowed;filter:grayscale(1)}
.node.done{background:var(--y);box-shadow:0 7px 0 #d9a900}
.unit b{display:block;margin:14px 0 2px;font-size:17px}.unit small{color:var(--mut);font-weight:700}
.row{margin:10px 0 24px}
.big{display:block;width:calc(100% - 32px);margin:0 16px 30px;padding:15px;border-radius:16px;background:var(--b);box-shadow:0 5px 0 #1899d6;color:#fff;font-weight:900;font-size:16px}
.top{display:flex;align-items:center;gap:14px;padding:14px 16px}
.x{background:none;font-size:24px;color:var(--mut)}
.bar{flex:1;height:16px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .3s}
.body{flex:1;padding:8px 20px 150px}
.tag{display:inline-block;padding:3px 10px;border-radius:8px;background:var(--card);color:var(--b);font-size:13px;margin-bottom:12px}
.body h2{margin:0 0 20px;font-size:21px;line-height:1.35;font-weight:900}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;margin-bottom:12px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--bg);font-size:16px;line-height:1.35}
.opt kbd{flex:none;width:30px;height:30px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font:inherit;font-size:14px;color:var(--mut)}
.opt.sel{border-color:var(--b);background:rgba(28,176,246,.12)}.opt.ok{border-color:var(--g);background:var(--gl)}.opt.bad{border-color:var(--r);background:var(--rl)}
.foot{position:fixed;left:0;right:0;bottom:0;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);background:var(--bg)}
.foot.ok{background:var(--gl);border-color:transparent}.foot.bad{background:var(--rl);border-color:transparent}
.foot>div{max-width:520px;margin:0 auto}
.fb{margin-bottom:12px;font-size:15px;line-height:1.4}.fb strong{display:block;font-size:19px;font-weight:900;margin-bottom:3px}
.ok .fb{color:var(--gd)}.bad .fb{color:var(--rd)}
.go{width:100%;padding:14px;border-radius:14px;font-weight:900;font-size:16px;color:#fff;background:var(--g);box-shadow:0 5px 0 var(--gd)}
.go:disabled{background:var(--line);box-shadow:0 5px 0 #c4c4c4;color:var(--mut);cursor:not-allowed}
.bad .go{background:var(--r);box-shadow:0 5px 0 var(--rd)}
.end{text-align:center;padding:60px 24px}.end .e{font-size:72px}.end h1{font-size:28px;margin:10px 0}
.res{display:flex;gap:12px;justify-content:center;margin:24px 0}.res div{padding:12px 18px;border:2px solid var(--line);border-radius:14px;font-weight:900}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div id="app"></div>
